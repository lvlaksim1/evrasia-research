name: Upload v79 to Dropbox

on:
  push:
    branches: [dropbox-upload-v79]

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download v79 APK from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v79 --repo "$GITHUB_REPOSITORY" --pattern "web-research-v79.apk" --dir .
          test -s web-research-v79.apk
          echo "Downloaded web-research-v79.apk ($(stat -c%s web-research-v79.apk) bytes)"

      - name: Upload v79 APK to Dropbox /GPT
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="web-research-v79.apk"
          TOKEN_JSON=$(curl --silent --show-error --fail-with-body https://api.dropboxapi.com/oauth2/token -u "${DROPBOX_APP_KEY}:${DROPBOX_APP_SECRET}" -d grant_type=refresh_token -d "refresh_token=${DROPBOX_REFRESH_TOKEN}")
          ACCESS_TOKEN=$(printf '%s' "$TOKEN_JSON" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Dropbox did not return an access token"
            exit 1
          fi
          API_ARG=$(jq -cn --arg path "/GPT/${FILE}" '{path:$path,mode:"overwrite",autorename:false,mute:false,strict_conflict:false}')
          RESPONSE=$(curl --silent --show-error --fail-with-body -X POST https://content.dropboxapi.com/2/files/upload -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Dropbox-API-Arg: ${API_ARG}" -H "Content-Type: application/octet-stream" --data-binary "@${FILE}")
          printf '%s' "$RESPONSE" | jq -e '.path_display == "/GPT/web-research-v79.apk"' >/dev/null
          echo "Uploaded to Dropbox: /GPT/web-research-v79.apk"
