name: Diagnose Dropbox v79 upload

on:
  push:
    branches: [dropbox-upload-v79]

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Download v79 APK from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release download v79 --repo "$GITHUB_REPOSITORY" --pattern "web-research-v79.apk" --dir .
          test -s web-research-v79.apk
          echo "Downloaded web-research-v79.apk ($(stat -c%s web-research-v79.apk) bytes)"

      - name: Get Dropbox access token and upload
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FILE="web-research-v79.apk"
          TOKEN_RESPONSE=$(curl --silent --show-error -w $'\n%{http_code}' https://api.dropboxapi.com/oauth2/token -u "${DROPBOX_APP_KEY}:${DROPBOX_APP_SECRET}" -d grant_type=refresh_token -d "refresh_token=${DROPBOX_REFRESH_TOKEN}")
          TOKEN_STATUS=${TOKEN_RESPONSE##*$'\n'}
          TOKEN_BODY=${TOKEN_RESPONSE%$'\n'*}
          if [ "$TOKEN_STATUS" != "200" ]; then
            echo "Dropbox token endpoint returned HTTP $TOKEN_STATUS"
            printf '%s' "$TOKEN_BODY" | jq . || printf '%s\n' "$TOKEN_BODY"
            exit 1
          fi
          ACCESS_TOKEN=$(printf '%s' "$TOKEN_BODY" | jq -r '.access_token // empty')
          test -n "$ACCESS_TOKEN"
          API_ARG=$(jq -cn --arg path "/GPT/${FILE}" '{path:$path,mode:"overwrite",autorename:false,mute:false,strict_conflict:false}')
          UPLOAD_RESPONSE=$(curl --silent --show-error -w $'\n%{http_code}' -X POST https://content.dropboxapi.com/2/files/upload -H "Authorization: Bearer ${ACCESS_TOKEN}" -H "Dropbox-API-Arg: ${API_ARG}" -H "Content-Type: application/octet-stream" --data-binary "@${FILE}")
          UPLOAD_STATUS=${UPLOAD_RESPONSE##*$'\n'}
          UPLOAD_BODY=${UPLOAD_RESPONSE%$'\n'*}
          if [ "$UPLOAD_STATUS" != "200" ]; then
            echo "Dropbox upload returned HTTP $UPLOAD_STATUS"
            printf '%s' "$UPLOAD_BODY" | jq . || printf '%s\n' "$UPLOAD_BODY"
            exit 1
          fi
          printf '%s' "$UPLOAD_BODY" | jq -e '.path_display == "/GPT/web-research-v79.apk"' >/dev/null
          echo "Uploaded to Dropbox: /GPT/web-research-v79.apk"
