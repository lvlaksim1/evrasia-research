name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Determine next release version
        id: version
        shell: bash
        run: |
          git fetch --tags --force
          LAST=$(git tag -l 'v[0-9]*' | sed 's/^v//' | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -z "$LAST" ]; then LAST=0; fi
          NEXT=$((LAST + 1))
          echo "number=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
      - name: Prepare stable signing key
        shell: bash
        run: |
          echo '' | base64 -d > webresearch.keystore
      - name: Prepare request detail geometry
        shell: bash
        run: python3 -c 'from pathlib import Path; p=Path("app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt"); s=p.read_text(); a=s.index("        dialog=AlertDialog.Builder(this).setView(root).create()", s.index("private fun showDetails")); b=s.index("        dialog.show()",a)+len("        dialog.show()"); n="        dialog=AlertDialog.Builder(this).setView(root).create()\n        val dm=resources.displayMetrics\n        dialog.window?.apply{\n            setBackgroundDrawable(rounded(bg,18f,line))\n            attributes=attributes.apply{\n                width=(dm.widthPixels*0.97).toInt()\n                height=(dm.heightPixels*0.92).toInt()\n            }\n        }\n        dialog.show()"; p.write_text(s[:a]+n+s[b:])'
      - name: Build APK
        env:
          WEB_RESEARCH_VERSION: v${{ steps.version.outputs.number }}
        run: gradle :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk web-research-v${{ steps.version.outputs.number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: web-research-v${{ steps.version.outputs.number }}
          path: web-research-v${{ steps.version.outputs.number }}.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: web research v${{ steps.version.outputs.number }}
          files: web-research-v${{ steps.version.outputs.number }}.apk
          make_latest: true
