name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk evrasia-research-v1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: evrasia-research-v1
          path: evrasia-research-v1.apk
      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1
          name: Евразия Research v1
          files: evrasia-research-v1.apk
          make_latest: true
