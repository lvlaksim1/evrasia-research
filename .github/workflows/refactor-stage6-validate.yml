name: Validate refactor stage6
on:
  push:
    branches: [refactor-stage6-v58]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[stage6-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        run: python tools/refactor_stage6.py
      - name: Verify extraction
        shell: bash
        run: |
          test -f app/src/main/java/ru/evrasia/research/WebResearchScripts.kt
          grep -q 'WebResearchScripts.instrumentation' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'WebResearchScripts.lightSnapshot' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'WebResearchScripts.fullSnapshot' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          ! grep -q 'const F=window.fetch' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'const F=window.fetch' app/src/main/java/ru/evrasia/research/WebResearchScripts.kt
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt app/src/main/java/ru/evrasia/research/WebResearchScripts.kt
          git commit -m 'refactor: extract browser scripts [stage6-applied]'
          git push
