name: Validate refactor stage8
on:
  push:
    branches: [refactor-stage8-v60]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[stage8-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        run: python tools/refactor_stage8.py
      - name: Verify extraction
        shell: bash
        run: |
          test -f app/src/main/java/ru/evrasia/research/NetworkReplayController.kt
          grep -q 'private val replayController by lazy' app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt
          grep -q 'replayController.show' app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt
          ! grep -q 'private fun editor(label:String,value:String,multiline:Boolean)' app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt
          ! grep -q 'private fun parseHeaderLines(raw:String)' app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt
          grep -q 'class NetworkReplayController' app/src/main/java/ru/evrasia/research/NetworkReplayController.kt
          grep -q 'NetworkRequestActions.replay' app/src/main/java/ru/evrasia/research/NetworkReplayController.kt
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt app/src/main/java/ru/evrasia/research/NetworkReplayController.kt
          git commit -m 'refactor: extract network replay controller [stage8-applied]'
          git push
