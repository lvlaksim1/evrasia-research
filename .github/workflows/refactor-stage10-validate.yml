name: Validate refactor stage10
on:
  push:
    branches: [refactor-stage10-v62]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[stage10-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        run: |
          python tools/fix_stage10_patch.py
          python tools/refactor_stage10.py
      - name: Verify extraction
        shell: bash
        run: |
          test -f app/src/main/java/ru/evrasia/research/WebNavigationController.kt
          test -f app/src/main/java/ru/evrasia/research/WebBookmarkController.kt
          test -f app/src/main/java/ru/evrasia/research/WebCookieStatsController.kt
          grep -q 'navigationController.navigate' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'bookmarkController.bind' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'statsController.update' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          ! grep -q 'private fun loadBookmarks' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          ! grep -q 'private fun toggleStats' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt app/src/main/java/ru/evrasia/research/WebNavigationController.kt app/src/main/java/ru/evrasia/research/WebBookmarkController.kt app/src/main/java/ru/evrasia/research/WebCookieStatsController.kt
          git commit -m 'refactor: extract browser ui controllers [stage10-applied]'
          git push
