name: Apply result delivery refactor
on:
  push:
    branches: [result-delivery-work]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: result-delivery-work
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        shell: bash
        run: |
          git show d99787d87ad76ba8b3a155ee1737b709f12fc7d1:.github/workflows/result-delivery-refactor.yml | sed -n "/python3 - <<'PY'/,/^          PY$/p" | sed '1d;$d;s/^          //' > /tmp/result-delivery-refactor.py
          python3 /tmp/result-delivery-refactor.py
      - name: Verify refactor
        shell: bash
        run: |
          ! grep -R "PostmanDelivery.mode\|PostmanDelivery.saveMode\|KEY_MODE" app/src/main/java/ru/evrasia/research
          grep -R "ResultDelivery.deliverText" app/src/main/java/ru/evrasia/research >/dev/null
      - name: Build APK on work branch
        run: gradle :app:assembleDebug
      - name: Commit verified refactor
        shell: bash
        run: |
          rm .github/workflows/result-delivery-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: unify copy and file delivery [skip ci]"
          git push origin HEAD:result-delivery-work
