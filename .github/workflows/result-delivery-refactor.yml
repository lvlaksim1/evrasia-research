name: Apply result delivery refactor
on:
  push:
    branches: [result-delivery-work]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: result-delivery-work
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        shell: bash
        run: |
          git show d99787d87ad76ba8b3a155ee1737b709f12fc7d1:.github/workflows/result-delivery-refactor.yml > /tmp/original-refactor.yml
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/original-refactor.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line) + 1
          end = next(i for i in range(start, len(lines)) if lines[i] == '          PY')
          output = []
          inside = False
          for original in lines[start:end]:
              line = original
              if inside:
                  if line == "          '''":
                      line = line[10:]
              elif line.startswith('          '):
                  line = line[10:]
              count = line.count("'''")
              output.append(line)
              if count % 2 == 1:
                  inside = not inside
          Path('/tmp/result-delivery-refactor.py').write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          python3 /tmp/result-delivery-refactor.py
      - name: Verify refactor
        shell: bash
        run: |
          ! grep -R "PostmanDelivery.mode\|PostmanDelivery.saveMode\|KEY_MODE" app/src/main/java/ru/evrasia/research
          grep -R "ResultDelivery.deliverText" app/src/main/java/ru/evrasia/research >/dev/null
      - name: Build APK on work branch
        run: gradle :app:assembleDebug
      - name: Commit verified refactor
        shell: bash
        run: |
          rm .github/workflows/result-delivery-refactor.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: unify copy and file delivery [skip ci]"
          git push origin HEAD:result-delivery-work
