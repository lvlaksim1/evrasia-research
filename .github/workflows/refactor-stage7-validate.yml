name: Validate refactor stage7
on:
  push:
    branches: [refactor-stage7-v59]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[stage7-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        run: python tools/refactor_stage7.py
      - name: Verify extraction
        shell: bash
        run: |
          test -f app/src/main/java/ru/evrasia/research/WebCaptureController.kt
          grep -q 'private lateinit var captureController: WebCaptureController' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'web.addJavascriptInterface(captureController.bridge' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          ! grep -q 'inner class Bridge' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          ! grep -q 'scriptChunks' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'class WebCaptureController' app/src/main/java/ru/evrasia/research/WebCaptureController.kt
          grep -q '@JavascriptInterface fun scriptChunk' app/src/main/java/ru/evrasia/research/WebCaptureController.kt
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt app/src/main/java/ru/evrasia/research/WebCaptureController.kt
          git commit -m 'refactor: extract web capture controller [stage7-applied]'
          git push
