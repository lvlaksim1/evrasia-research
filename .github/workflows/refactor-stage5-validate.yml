name: Validate refactor stage5
on:
  push:
    branches: [refactor-stage5-v57]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[stage5-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        run: python tools/refactor_stage5.py
      - name: Verify extraction
        shell: bash
        run: |
          test -f app/src/main/java/ru/evrasia/research/WebResourceCapture.kt
          ! grep -q 'captureExecutor' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          ! grep -q 'downloadingScripts' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          ! grep -q 'downloadingResources' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'resourceCapture.captureResource' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'class WebResourceCapture' app/src/main/java/ru/evrasia/research/WebResourceCapture.kt
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt app/src/main/java/ru/evrasia/research/WebResourceCapture.kt
          git commit -m 'refactor: extract browser resource capture [stage5-applied]'
          git push
