name: Validate refactor stage12
on:
  push:
    branches: [refactor-stage12-v64]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[stage12-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        run: python tools/refactor_stage12.py
      - name: Verify extraction
        shell: bash
        run: |
          test -f app/src/main/java/ru/evrasia/research/WebResearchWebViewController.kt
          test -f app/src/main/java/ru/evrasia/research/WebResearchExportController.kt
          grep -q 'webViewController.install' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'exportController.handleResult' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          ! grep -q 'web.webChromeClient = object' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt app/src/main/java/ru/evrasia/research/WebResearchWebViewController.kt app/src/main/java/ru/evrasia/research/WebResearchExportController.kt
          git commit -m 'refactor: extract webview and export controllers [stage12-applied]'
          git push
