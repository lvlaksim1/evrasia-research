name: Refactor stage 3 apply
on:
  push:
    branches: [refactor-stage3-v53]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stage3-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-stage3-v53
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        run: python3 tools/refactor_stage3.py
      - name: Verify structural cleanup
        shell: bash
        run: |
          if grep -R "getDeclaredField\|getDeclaredMethod" -n app/src/main/java/ru/evrasia/research; then
            echo "Reflection coupling still present"
            exit 1
          fi
          if grep -q "Prepare request detail geometry" .github/workflows/android-apk.yml; then
            echo "Build-time source patch still present"
            exit 1
          fi
          if [ -e app/src/main/java/ru/evrasia/research/NetworkDebuggerCompat.kt ]; then
            echo "Obsolete debugger compatibility file still present"
            exit 1
          fi
      - name: Build APK
        env:
          WEB_RESEARCH_VERSION: v53-refactor-check
        run: gradle :app:assembleDebug
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A app/src/main/java/ru/evrasia/research .github/workflows/android-apk.yml
          git commit -m "refactor: remove reflection and build-time source patches [stage3-applied]"
          git push origin HEAD:refactor-stage3-v53
