name: Auth analyzer work build
on:
  push:
    branches: [auth-analyzer-work]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[auth-ready]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: auth-analyzer-work
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Wire AUTH analyzer into browser UI
        shell: python
        run: |
          from pathlib import Path
          path = Path('app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt')
          text = path.read_text(encoding='utf-8')

          old = '    private lateinit var captureController: WebCaptureController\n'
          new = old + '    private lateinit var authSessionController: AuthSessionController\n'
          if 'private lateinit var authSessionController: AuthSessionController' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          old = '        web.addJavascriptInterface(captureController.bridge, "EvrasiaResearch")\n'
          new = old + '        authSessionController = AuthSessionController(this, web)\n'
          if 'authSessionController = AuthSessionController(this, web)' not in text:
              assert old in text
              text = text.replace(old, new, 1)

          marker = '            addSection("ИССЛЕДОВАНИЕ")\n'
          auth = '''            addSection("ИССЛЕДОВАНИЕ")
            val authActive = ::authSessionController.isInitialized && authSessionController.isActive()
            addMenuRow(
                "A",
                if (authActive) "AUTH — завершить анализ" else "AUTH — анализ авторизации",
                if (authActive) "Выполните вход и нажмите ещё раз" else "Трафик авторизации → Postman Collection"
            ) {
                dialog.dismiss()
                if (::authSessionController.isInitialized) authSessionController.toggle()
            }
'''
          if 'AUTH — анализ авторизации' not in text:
              assert marker in text
              text = text.replace(marker, auth, 1)

          old = '''            addMenuRow("○", "Очистить текущую сессию", "События, JS, ресурсы и сетевой журнал") {
                archive.clear()
'''
          new = '''            addMenuRow("○", "Очистить текущую сессию", "События, JS, ресурсы и сетевой журнал") {
                if (::authSessionController.isInitialized) authSessionController.cancel()
                archive.clear()
'''
          if new not in text:
              assert old in text
              text = text.replace(old, new, 1)

          old = '''    override fun onDestroy() {
        if (::captureController.isInitialized) captureController.shutdown()
        super.onDestroy()
    }
'''
          new = '''    override fun onDestroy() {
        if (::authSessionController.isInitialized) authSessionController.cancel()
        if (::captureController.isInitialized) captureController.shutdown()
        super.onDestroy()
    }
'''
          if new not in text:
              assert old in text
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Commit verified browser wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          if git diff --cached --quiet; then
            echo "No UI patch to commit"
          else
            git commit -m "feat: wire AUTH analyzer into browser [auth-ready] [skip ci]"
            git push origin HEAD:auth-analyzer-work
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: auth-analyzer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
