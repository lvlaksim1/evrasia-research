name: Validate browser navigation v43
on:
  push:
    branches: [fix/browser-navigation-v43]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        env:
          WEB_RESEARCH_VERSION: v43-validation
        run: gradle :app:assembleDebug
