name: Validate refactor stage9
on:
  push:
    branches: [refactor-stage9-v61]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[stage9-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        run: python tools/refactor_stage9.py
      - name: Verify extraction
        shell: bash
        run: |
          test -f app/src/main/java/ru/evrasia/research/NetworkEventCorrelator.kt
          grep -q 'NetworkEventCorrelator.findMergeTarget' app/src/main/java/ru/evrasia/research/NetworkDebugStore.kt
          grep -q 'NetworkEventCorrelator.mergeInto' app/src/main/java/ru/evrasia/research/NetworkDebugStore.kt
          grep -q 'NetworkEventCorrelator.isMirroredReplay' app/src/main/java/ru/evrasia/research/NetworkDebugStore.kt
          grep -q 'internal object NetworkEventCorrelator' app/src/main/java/ru/evrasia/research/NetworkEventCorrelator.kt
          ! grep -q 'private fun findMergeTarget' app/src/main/java/ru/evrasia/research/NetworkDebugStore.kt
          ! grep -q 'MATCH_WINDOW_MS' app/src/main/java/ru/evrasia/research/NetworkDebugStore.kt
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ru/evrasia/research/NetworkDebugStore.kt app/src/main/java/ru/evrasia/research/NetworkEventCorrelator.kt
          git commit -m 'refactor: extract network event correlator [stage9-applied]'
          git push
