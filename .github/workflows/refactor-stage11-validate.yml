name: Validate refactor stage11
on:
  push:
    branches: [refactor-stage11-v63]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[stage11-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        run: python tools/refactor_stage11.py
      - name: Verify extraction
        shell: bash
        run: |
          test -f app/src/main/java/ru/evrasia/research/NetworkDebuggerDataSource.kt
          grep -q 'NetworkDebuggerDataSource()' app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt
          grep -q 'dataSource.refresh' app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt
          ! grep -q 'private val storeCache' app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt app/src/main/java/ru/evrasia/research/NetworkDebuggerDataSource.kt
          git commit -m 'refactor: extract debugger data source [stage11-applied]'
          git push
