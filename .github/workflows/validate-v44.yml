name: Validate cookies and pull refresh v44
on:
  push:
    branches: [feat/cookies-pull-refresh-v44]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        env:
          WEB_RESEARCH_VERSION: v44-validation
        run: gradle :app:assembleDebug
