name: Refactor stage 6 apply
on:
  push:
    branches: [refactor-stage6-v56]
permissions:
  contents: write
jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[stage6-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-stage6-v56
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply refactor
        run: python3 tools/refactor_stage6.py
      - name: Verify repository ownership
        shell: bash
        run: |
          if grep -R "syncNetworkStore" -n app/src/main/java/ru/evrasia/research; then
            echo "Legacy polling sync still present"
            exit 1
          fi
          if grep -n "archive\.scripts\[.*\] =\|archive\.scriptErrors\[.*\] =\|archive\.extraArtifacts\[.*\] =\|archive\.resourceMeta\[.*\] =" app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt; then
            echo "Direct archive mutation still present"
            exit 1
          fi
      - name: Build APK
        env:
          WEB_RESEARCH_VERSION: v56-refactor-check
        run: gradle :app:assembleDebug
      - name: Commit validated refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ru/evrasia/research
          git commit -m "refactor: centralize research archive state updates [stage6-applied]"
          git push origin HEAD:refactor-stage6-v56
