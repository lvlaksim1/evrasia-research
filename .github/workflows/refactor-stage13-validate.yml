name: Validate refactor stage13
on:
  push:
    branches: [refactor-stage13-v65]
permissions:
  contents: write
jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[stage13-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply cleanup
        run: python tools/refactor_stage13.py
      - name: Verify compatibility cleanup
        shell: bash
        run: |
          test ! -f app/src/main/java/ru/evrasia/research/TextColorCompat.kt
          test ! -f app/src/main/java/ru/evrasia/research/SpinnerCompat.kt
          ! grep -R -F 'setTextColor(text)' app/src/main/java/ru/evrasia/research --include='*.kt'
          ! grep -R -F 'popupBackgroundDrawable=' app/src/main/java/ru/evrasia/research --include='*.kt'
          grep -q 'private val textColor = Color.rgb' app/src/main/java/ru/evrasia/research/WebResearchV10Activity.kt
          grep -q 'setPopupBackgroundDrawable' app/src/main/java/ru/evrasia/research/NetworkDebuggerActivity.kt
      - name: Build APK
        run: gradle :app:assembleDebug
      - name: Commit validated cleanup
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A app/src/main/java/ru/evrasia/research
          git commit -m 'refactor: remove compatibility shims [stage13-applied]'
          git push
